name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Formatting
        run: pnpm run format --no-errors-on-unmatched --check

      - name: Lint
        run: pnpm run lint

      - name: Type Check
        run: pnpm run build

      - name: Run Tests
        run: pnpm run test
        env:
          E2E: true # Run E2E tests against the Stoplight mock server
