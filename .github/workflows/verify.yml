name: Verify PR

on:
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Formatting
        run: pnpm exec biome format --check .

      - name: Lint
        run: pnpm run lint

      - name: Type Check
        run: pnpm run build

      - name: Run Unit Tests
        run: pnpm vitest run tests/unit
